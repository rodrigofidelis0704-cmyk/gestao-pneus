name: Extract source for fixes

on:
  push:
    branches:
      - fix/troca-rodizio-estoque
    paths:
      - '.github/workflows/extract-source.yml'

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/troca-rodizio-estoque
      - name: Extract application source
        run: |
          rm -rf appsrc
          mkdir -p appsrc
          unzip -q gestao-pneus-completo.zip -d appsrc
      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appsrc
          git commit -m "Extract application source for UI fixes" || exit 0
          git push origin HEAD:fix/troca-rodizio-estoque
